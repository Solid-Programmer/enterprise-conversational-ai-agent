[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-agent"
version = "0.1.0"
description = "Authenticated, retrieval-augmented conversational analytics backend."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "PyJWT[crypto]>=2.8.0",
    "pyodbc>=5.1.0",
    "sqlalchemy>=2.0.0",
    "sqlglot>=23.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.12.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
    "ollama>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = [
    "live: requires configured external services (Ollama, Qdrant, SQL Server, and RBAC data).",
]

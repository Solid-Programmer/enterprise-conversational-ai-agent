name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      AUTH0_DOMAIN: ci.example.invalid
      AUTH0_AUDIENCE: https://enterprise-ai-agent-ci
      WARM_RUNTIME_ON_STARTUP: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run unit and mocked integration tests
        run: python -m pytest -m "not live"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: npm --prefix frontend ci && npm --prefix frontend run build

  backend-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend container
        run: docker build -t enterprise-ai-agent-backend ./backend
